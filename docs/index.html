<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USBands Score Tracker</title>
<meta name="description" content="Rankings, score history, and championship tracking across the USBands circuit.">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <div class="site-header__title">
        <span class="site-header__mark" aria-hidden="true">&#9835;</span>
        <div>
          <h1>USBands Score Tracker</h1>
          <label class="season-select-wrap">
            <span class="sr-only">Season</span>
            <select id="season-select" class="season-select" aria-label="Season"></select>
          </label>
        </div>
      </div>
      <div class="site-header__actions">
        <div class="theme-color-wrap">
          <button id="theme-color-toggle" class="theme-toggle" type="button" aria-label="Customize colors" aria-haspopup="true">
            <span aria-hidden="true">&#127912;</span>
          </button>
          <div id="theme-color-panel" class="theme-color-panel" hidden>
            <p class="theme-color-panel__title">Customize colors</p>
            <div class="theme-color-fields">
              <label class="theme-color-field">
                <span>Primary</span>
                <input type="color" id="theme-primary-input" value="#1b5e3b">
              </label>
              <label class="theme-color-field">
                <span>Accent</span>
                <input type="color" id="theme-accent-input" value="#d4a017">
              </label>
            </div>
            <p class="theme-color-panel__subtitle">Presets</p>
            <div id="theme-presets" class="theme-presets"></div>
            <button id="theme-reset" class="theme-reset" type="button">Reset to Green &amp; Gold</button>
          </div>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
          <span id="theme-toggle-icon" aria-hidden="true">&#9789;</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div id="mybands"></div>

    <div class="filters" role="group" aria-label="Filters">
      <label class="field">
        <span class="field__label">Group</span>
        <select id="filter-division"></select>
      </label>
      <label class="field">
        <span class="field__label">State championship</span>
        <select id="filter-state"></select>
      </label>
      <label class="field">
        <span class="field__label">Home state</span>
        <select id="filter-home-state"></select>
      </label>
      <label class="field field--checkbox">
        <input type="checkbox" id="filter-finals">
        <span>Finals qualifiers only</span>
      </label>
      <label class="field field--checkbox">
        <input type="checkbox" id="filter-favorites">
        <span>Favorites only</span>
      </label>
      <label class="field field--search">
        <span class="field__label">Search</span>
        <input type="search" id="filter-search" placeholder="Band or school name…" autocomplete="off">
      </label>
    </div>

    <div class="export-toolbar">
      <button id="export-csv" type="button" class="export-btn">Export CSV</button>
      <button id="export-print" type="button" class="export-btn">Print</button>
    </div>

    <div id="status" class="status" role="status">Loading season data…</div>
    <div id="results"></div>
  </main>

  <footer class="site-footer">
    <p>Data scraped from <a href="https://usbands.org/events/" target="_blank" rel="noopener">usbands.org</a>,
       refreshed weekly. Source on
       <a href="https://github.com/mgaehring-oss/usbands-db" target="_blank" rel="noopener">GitHub</a>.</p>
  </footer>

  <div id="detail-overlay" class="detail-overlay" hidden>
    <div class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <button id="detail-close" class="detail-panel__close" type="button" aria-label="Close">&times;</button>
      <h2 id="detail-title-row"><span id="detail-title"></span></h2>
      <p id="detail-sub" class="detail-panel__sub"></p>
      <div class="segmented" role="group" aria-label="Time range">
        <button type="button" class="segmented__option is-active" id="detail-mode-season">This Season</button>
        <button type="button" class="segmented__option" id="detail-mode-all">All Seasons</button>
      </div>
      <div id="detail-chart" class="detail-chart"></div>
      <p id="detail-chart-caption" class="detail-chart-caption" hidden>┄ dashed = group changed</p>
      <div class="table-scroll">
        <table class="detail-table">
          <thead>
            <tr>
              <th>Date</th><th>Event</th><th>Season</th><th>Group</th>
              <th class="num">Score</th><th class="num">Rank</th>
            </tr>
          </thead>
          <tbody id="detail-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="compare-overlay" class="detail-overlay" hidden>
    <div class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="compare-title">
      <button id="compare-close" class="detail-panel__close" type="button" aria-label="Close">&times;</button>
      <h2 id="compare-title">Comparing my bands</h2>
      <p id="compare-sub" class="detail-panel__sub"></p>
      <div id="compare-legend" class="compare-legend"></div>
      <div id="compare-chart" class="detail-chart"></div>
      <div class="table-scroll">
        <table class="detail-table">
          <thead>
            <tr>
              <th>Band</th><th>Group</th>
              <th class="num">Latest</th><th class="num">Prior</th><th class="num">Δ</th>
            </tr>
          </thead>
          <tbody id="compare-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
  <script src="app.js"></script>
</body>
</html>
