name: Update USBands database

on:
  schedule:
    # Sunday and Monday at 18:00 UTC (2pm EDT / 1pm EST): Sunday afternoon
    # picks up Saturday shows (and any Sunday ones) as soon as they're
    # entered, Monday afternoon catches late postings and corrections. GitHub
    # often starts scheduled runs late, so this is "afternoon", not a promise.
    - cron: "0 18 * * 0,1"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Force this run to fail (to test the failure-notification path)"
        type: boolean
        default: false
      is_retry:
        description: "Set by freshness-check.yml when it re-dispatches after a failed/cancelled run"
        type: boolean
        default: false
      pretend_today:
        description: "Test only: YYYY-MM-DD to run the season gate as of (use with is_retry, since manual runs bypass the gate)"
        default: ""

env:
  BACKFILL_START_YEAR: "2022"   # earliest season with real marching-band data; rarely changes
  # The current season year is no longer a hand-bumped constant: the season
  # gate below derives it from the calendar, so the next season resumes on its own.

# A watchdog retry must never overlap a late scheduled run -- both would try
# to commit and push the rebuilt database. Queue instead of cancelling, so a
# run that's already mid-scrape is never killed.
concurrency:
  group: update-usbands
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Simulate failure (manual test only)
        if: ${{ inputs.simulate_failure }}
        run: |
          echo "Forcing a failure because simulate_failure was set."
          exit 1

      - name: Run scraper tests
        run: python -m unittest discover -s scrape/tests

      # The cron fires year-round, but once a season is over (final-day
      # results in, grace period past) there's nothing new to fetch until the
      # next one starts. In that case the job still SUCCEEDS -- just without
      # scraping -- so freshness-check.yml's retry/alert logic, which reads
      # run history, keeps seeing a healthy job all winter. A person
      # dispatching a run by hand always scrapes; retries and the schedule
      # respect the gate. See .github/scripts/season_gate.py for the rules.
      - name: Decide whether the season needs scraping
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_RETRY: ${{ inputs.is_retry }}
          PRETEND_TODAY: ${{ inputs.pretend_today }}
        run: |
          args=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$IS_RETRY" != "true" ]; then args="--force"; fi
          if [ -n "$PRETEND_TODAY" ]; then args="$args --today $PRETEND_TODAY"; fi
          python .github/scripts/season_gate.py docs/data/usbands.db $args

      - name: Scrape and rebuild database
        if: steps.gate.outputs.run == 'true'
        env:
          SEASON_YEAR: ${{ steps.gate.outputs.season_year }}
        run: python scrape/update_scores.py "$BACKFILL_START_YEAR" "$SEASON_YEAR" docs/data/usbands.db data/cache

      - name: Commit and push if changed
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/usbands.db data/cache
          if git diff --cached --quiet; then
            echo "No changes."
          else
            # The stamp drives the footer date and the site's "New scores are
            # available" banner, so it only moves when SCORES changed -- not
            # for event registrations, which shift almost daily in season
            # (see .github/scripts/scores_changed.py). Exit 1 = unchanged;
            # anything else (changed, or couldn't compare) stamps.
            old_db="$RUNNER_TEMP/previous.db"
            rc=0
            if git show HEAD:docs/data/usbands.db > "$old_db" 2>/dev/null; then
              python .github/scripts/scores_changed.py "$old_db" docs/data/usbands.db || rc=$?
            fi
            if [ "$rc" -ne 1 ]; then
              date -u +"%Y-%m-%dT%H:%M:%SZ" > docs/data/last_updated.txt
              git add docs/data/last_updated.txt
            fi
            git commit -m "Update USBands database ($(date -u +%Y-%m-%d))"
            git push
          fi

      # --- Failure notification -------------------------------------------
      # A failed run (or a step above that tripped the sanity check and
      # exited non-zero) would otherwise be silent unless someone happens to
      # check the Actions tab. These two steps only run `if: failure()`, i.e.
      # only when something above didn't succeed.

      - name: File or update a failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Weekly USBands scrape failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });
            const existing = openIssues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Failed again: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `The scheduled scrape failed or tripped its sanity check.\n\nFailed run: ${runUrl}\n\nThis issue closes automatically once a scheduled run succeeds again.`,
              });
            }

      # Retry runs (is_retry) still comment on the failure issue, but don't
      # email again: freshness-check.yml emails once if the job is still
      # failing after 8 days, instead of one message per failed retry.
      - name: Email failure notification
        if: failure() && !inputs.is_retry
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: USBands Scraper <${{ secrets.MAIL_USERNAME }}>
          to: mgaehring@gmail.com
          subject: "USBands scraper failed"
          body: |
            The weekly USBands scrape failed or tripped its sanity check.

            Failed run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # --- Auto-clear on the next success ---------------------------------

      - name: Close any open failure issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Weekly USBands scrape failed";
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });
            for (const issue of openIssues.filter((i) => i.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "Resolved -- a scheduled run succeeded again.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }
