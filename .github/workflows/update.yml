name: Update USBands database

on:
  schedule:
    # Sundays at 12:00 UTC (8am EDT / 7am EST) -- after Saturday's events are scored
    - cron: "0 12 * * 0"
  workflow_dispatch: {}

env:
  BACKFILL_START_YEAR: "2022"   # earliest season with real marching-band data; rarely changes
  CURRENT_SEASON_YEAR: "2026"   # bump when usbands.org posts the next season -- always scraped fresh, never cached

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Scrape and rebuild database
        run: python scrape/update_scores.py "$BACKFILL_START_YEAR" "$CURRENT_SEASON_YEAR" docs/data/usbands.db data/cache

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/usbands.db data/cache
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update USBands database ($(date -u +%Y-%m-%d))"
            git push
          fi
