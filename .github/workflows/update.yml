name: Update USBands database

on:
  schedule:
    # Sundays at 12:00 UTC (8am EDT / 7am EST) -- after Saturday's events are scored
    - cron: "0 12 * * 0"
  workflow_dispatch: {}

env:
  SEASON_YEAR: "2026"  # bump when usbands.org posts the next season

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Scrape and rebuild database
        run: python scrape/update_scores.py "$SEASON_YEAR" docs/data/usbands.db

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/data/usbands.db; then
            echo "No changes."
          else
            git add docs/data/usbands.db
            git commit -m "Update USBands database ($(date -u +%Y-%m-%d))"
            git push
          fi
