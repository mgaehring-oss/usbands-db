name: Check update freshness

# update.yml's own failure alerts only cover a job that starts and then
# fails. A job GitHub never starts (cancelled before any step ran, a
# skipped/delayed cron, a disabled schedule) is silent from inside it --
# that's exactly how a cancelled Oct 5 run left the data stale for four
# days with no alert. This watchdog runs separately and checks from the
# outside.
#
# It deliberately looks at when update.yml last SUCCEEDED, not at
# docs/data/last_updated.txt: that file only changes when scores change, so
# a quiet week or the off-season would look "stale" while everything is
# healthy. A successful run with no data changes still counts as fresh.

on:
  schedule:
    - cron: "0 15 * * *"   # daily; GitHub may start it late
  workflow_dispatch:
    inputs:
      simulate_stale:
        description: "Force a stale result (to test the alert path)"
        type: boolean
        default: false

env:
  # Weekly cron + several hours of GitHub scheduling delay + a little slack.
  MAX_AGE_DAYS: "8"

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Find the last successful update run
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          SIMULATE_STALE: ${{ inputs.simulate_stale }}
        run: |
          last=$(gh run list --repo "${{ github.repository }}" --workflow=update.yml \
                   --status=success --limit 1 --json createdAt -q '.[0].createdAt')
          now=$(date -u +%s)
          if [ -z "$last" ]; then
            age_days=9999
            message="update.yml has no successful run on record."
          else
            age_days=$(( (now - $(date -u -d "$last" +%s)) / 86400 ))
            message="The last successful update run was $last (${age_days} days ago; limit is ${MAX_AGE_DAYS})."
          fi
          echo "$message"
          if [ "$SIMULATE_STALE" = "true" ]; then
            age_days=9999
            message="SIMULATED: $message"
          fi
          if [ "$age_days" -gt "$MAX_AGE_DAYS" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi
          echo "message=$message" >> "$GITHUB_OUTPUT"

      - name: File or update a staleness issue
        if: steps.freshness.outputs.stale == 'true'
        uses: actions/github-script@v7
        env:
          MESSAGE: ${{ steps.freshness.outputs.message }}
        with:
          script: |
            const title = "USBands update job hasn't succeeded recently";
            const runsUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/update.yml`;
            const body = `${process.env.MESSAGE}\n\nThe weekly scrape may have been cancelled, skipped, or disabled before any of its own failure alerts could fire. Check: ${runsUrl}\n\nThis issue closes automatically once update.yml succeeds again.`;
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });
            const existing = openIssues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still stale: ${process.env.MESSAGE}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Email staleness notification
        if: steps.freshness.outputs.stale == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: USBands Scraper <${{ secrets.MAIL_USERNAME }}>
          to: mgaehring@gmail.com
          subject: "USBands data may be stale"
          body: |
            ${{ steps.freshness.outputs.message }}

            The weekly update may have been cancelled, skipped, or disabled.
            Check: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/update.yml

      - name: Close any open staleness issue
        if: steps.freshness.outputs.stale == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "USBands update job hasn't succeeded recently";
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });
            for (const issue of openIssues.filter((i) => i.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "Resolved -- update.yml has succeeded recently again.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }
